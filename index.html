    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        canvas { display: block; outline: none; }

        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

            transition: opacity 0.3s ease-in-out; 
            overflow: visible !important; 
            max-height: none !important;
            padding: 0.875rem;
            opacity: 1;
        }
        .collapsible-content.collapsed {
            max-height: 0px !important;
            padding-top: 0px !important;
            padding-bottom: 0px !important;
            padding-left: 0px !important;
            padding-right: 0px !important;
            opacity: 0;
            overflow: hidden !important;
            border: none !important;

    </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col antialiased">

                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>

                    <div id="hudVariantTitle" class="text-sm font-bold text-white tracking-wide">Varianta 1 / 6</div>

    <script>
        function toggleSection(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById('icon_' + id);
            if (!el) return;
            
            if (el.classList.contains('collapsed')) {
                el.classList.remove('collapsed');
                if (icon) icon.classList.add('rotate-180');
            } else {
                el.classList.add('collapsed');
                if (icon) icon.classList.remove('rotate-180');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const openSections = ['secEnv', 'secBox', 'secItem', 'secResults'];
            openSections.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('collapsed');
            });
        });

        let scene, camera, renderer, controls;
        let boxGroup = new THREE.Group();
        let euroboxMesh, euroboxWireframe;
        let isWireframeTransparent = true;

        const container = document.getElementById('canvasContainer');

        let computedNoBundleVariants = [];
        let computedBundleVariants = [];
        let selectedVariantTab = 'nobundle';
        let selectedVariantIndex = 0;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(60, 50, 70);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 80, 50);
            scene.add(dirLight);

            const dirLight2 = new THREE.DirectionalLight(0x94a3b8, 0.4);
            dirLight2.position.set(-50, -30, -50);
            scene.add(dirLight2);

            const gridHelper = new THREE.GridHelper(100, 20, 0x334155, 0x1e293b);
            gridHelper.position.y = -0.05;
            scene.add(gridHelper);

            scene.add(boxGroup);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function resolveDims(w, l, h, code) {
            const dims = [w, l, h].sort((a, b) => b - a);
            const max = dims[0], mid = dims[1], min = dims[2];

            if (code === 'vyska') {
                return { dw: mid, dl: min, dh: max, label: 'Na výšku (0°)' };
            } else if (code === 'vyska_90') {
                return { dw: min, dl: mid, dh: max, label: 'Na výšku (90°)' };
            } else if (code === 'bok') {
                return { dw: max, dl: min, dh: mid, label: 'Na bok (0°)' };
            } else if (code === 'bok_90') {
                return { dw: min, dl: max, dh: mid, label: 'Na bok (90°)' };
            } else if (code === 'lezato') {
                return { dw: max, dl: mid, dh: min, label: 'Na ležato (0°)' };
            } else if (code === 'lezato_90') {
                return { dw: mid, dl: max, dh: min, label: 'Na ležato (90°)' };
            }
            return { dw: mid, dl: min, dh: max, label: 'Na výšku' };
        }

        function packSubSpaceLimited(spaceW, spaceL, spaceH, itemW, itemL, itemH, orientCode, maxItems, isBundled, bundleSize) {
            const d = resolveDims(itemW, itemL, itemH, orientCode);
            const iw = d.dw, il = d.dl, ih = d.dh;

            if (iw > spaceW || il > spaceL || ih > spaceH || maxItems < (isBundled ? bundleSize : 1)) {
                return { count: 0, boxes: [], bundles: [], dims: d, usedW: 0, usedL: 0, usedH: 0, bundleCount: 0 };
            }

            if (isBundled) {
                let thicknessAxis = 'Z';
                if (iw <= il && iw <= ih) thicknessAxis = 'X';
                else if (il <= iw && il <= ih) thicknessAxis = 'Y';

                const bw = (thicknessAxis === 'X') ? bundleSize * iw : iw;
                const bl = (thicknessAxis === 'Y') ? bundleSize * il : il;
                const bh = (thicknessAxis === 'Z') ? bundleSize * ih : ih;

                if (bw > spaceW || bl > spaceL || bh > spaceH) {
                    return { count: 0, boxes: [], bundles: [], dims: d, usedW: 0, usedL: 0, usedH: 0, bundleCount: 0 };
                }

                const maxNx = Math.floor(spaceW / bw);
                const maxNy = Math.floor(spaceL / bl);
                const maxNz = Math.floor(spaceH / bh);

                let bBoxes = [];
                let bundleBoxes = [];
                let bCount = 0;
                let maxUsedW = 0, maxUsedL = 0, maxUsedH = 0;
                const maxBundlesCount = Math.floor(maxItems / bundleSize);

                outerBundle: for (let z = 0; z < maxNz; z++) {
                    for (let y = 0; y < maxNy; y++) {
                        for (let x = 0; x < maxNx; x++) {
                            if (bCount >= maxBundlesCount) break outerBundle;

                            const bx = x * bw;
                            const by = y * bl;
                            const bz = z * bh;

                            bundleBoxes.push({ x: bx, y: by, z: bz, w: bw, l: bl, h: bh });

                            for (let i = 0; i < bundleSize; i++) {
                                let ix = bx, iy = by, iz = bz;
                                if (thicknessAxis === 'X') ix += i * iw;
                                else if (thicknessAxis === 'Y') iy += i * il;
                                else if (thicknessAxis === 'Z') iz += i * ih;

                                bBoxes.push({ x: ix, y: iy, z: iz, w: iw, l: il, h: ih });
                            }

                            bCount++;
                            maxUsedW = Math.max(maxUsedW, bx + bw);
                            maxUsedL = Math.max(maxUsedL, by + bl);
                            maxUsedH = Math.max(maxUsedH, bz + bh);
                        }
                    }
                }

                if (bCount > 0) {
                    return {
                        count: bCount * bundleSize,
                        boxes: bBoxes,
                        bundles: bundleBoxes,
                        dims: d,
                        usedW: maxUsedW,
                        usedL: maxUsedL,
                        usedH: maxUsedH,
                        bundleCount: bCount
                    };
                }
                return { count: 0, boxes: [], bundles: [], dims: d, usedW: 0, usedL: 0, usedH: 0, bundleCount: 0 };

            } else {
                const maxNx = Math.floor(spaceW / iw);
                const maxNy = Math.floor(spaceL / il);
                const maxNz = Math.floor(spaceH / ih);

                let boxes = [];
                let count = 0;
                let maxUsedW = 0, maxUsedL = 0, maxUsedH = 0;

                outer: for (let z = 0; z < maxNz; z++) {
                    for (let y = 0; y < maxNy; y++) {
                        for (let x = 0; x < maxNx; x++) {
                            if (count >= maxItems) break outer;
                            boxes.push({
                                x: x * iw,
                                y: y * il,
                                z: z * ih,
                                w: iw,
                                l: il,
                                h: ih
                            });
                            count++;
                            maxUsedW = Math.max(maxUsedW, (x + 1) * iw);
                            maxUsedL = Math.max(maxUsedL, (y + 1) * il);
                            maxUsedH = Math.max(maxUsedH, (z + 1) * ih);
                        }
                    }
                }

                return {
                    count,
                    boxes,
                    bundles: [],
                    dims: d,
                    usedW: maxUsedW,
                    usedL: maxUsedL,
                    usedH: maxUsedH,
                    bundleCount: 0
                };
            }
        }

        function evaluateSubCodesPermutation(boxW, boxL, boxH, itemW, itemL, itemH, subCodesPerm, targetCount, isBundled, bundleSize) {
            let remainders = [{ x: 0, y: 0, z: 0, w: boxW, l: boxL, h: boxH }];
            let rawZones = [];
            let totalBoxesCount = 0;
            let remainingTarget = (targetCount > 0) ? targetCount : Infinity;
            const minItemsPerPack = isBundled ? bundleSize : 1;

            for (let sIdx = 0; sIdx < subCodesPerm.length; sIdx++) {
                if (remainders.length === 0 || remainingTarget < minItemsPerPack) break;

                remainders.sort((a, b) => (b.w * b.l * b.h) - (a.w * a.l * a.h));
                const subCode = subCodesPerm[sIdx];

                for (let rIdx = 0; rIdx < remainders.length; rIdx++) {
                    if (remainingTarget < minItemsPerPack) break;
                    const rem = remainders[rIdx];
                    const sub = packSubSpaceLimited(rem.w, rem.l, rem.h, itemW, itemL, itemH, subCode, remainingTarget, isBundled, bundleSize);

                    if (sub.count > 0) {
                        remainders.splice(rIdx, 1);
                        const s = sub;

                        const worldBoxes = sub.boxes.map(b => ({
                            x: b.x + rem.x,
                            y: b.y + rem.y,
                            z: b.z + rem.z,
                            w: b.w, l: b.l, h: b.h
                        }));

                        const worldBundles = (sub.bundles || []).map(b => ({
                            x: b.x + rem.x,
                            y: b.y + rem.y,
                            z: b.z + rem.z,
                            w: b.w, l: b.l, h: b.h
                        }));

                        rawZones.push({
                            count: sub.count,
                            bundleCount: sub.bundleCount,
                            boxes: worldBoxes,
                            bundles: worldBundles,
                            dims: sub.dims,
                            orientCode: subCode
                        });
                        totalBoxesCount += sub.count;
                        remainingTarget -= sub.count;

                        if (rem.w - s.usedW > 0) {
                            remainders.push({ x: rem.x + s.usedW, y: rem.y, z: rem.z, w: rem.w - s.usedW, l: rem.l, h: rem.h });
                        }
                        if (rem.l - s.usedL > 0) {
                            remainders.push({ x: rem.x, y: rem.y + s.usedL, z: rem.z, w: s.usedW, l: rem.l - s.usedL, h: rem.h });
                        }
                        if (rem.h - s.usedH > 0) {
                            remainders.push({ x: rem.x, y: rem.y, z: rem.z + s.usedH, w: s.usedW, l: s.usedL, h: rem.h - s.usedH });
                        }
                        break;
                    }
                }
            }

            let zoneMap = new Map();
            for (let z of rawZones) {
                if (!zoneMap.has(z.orientCode)) {
                    zoneMap.set(z.orientCode, {
                        count: 0,
                        bundleCount: 0,
                        boxes: [],
                        bundles: [],
                        dims: z.dims,
                        orientCode: z.orientCode
                    });
                }
                let merged = zoneMap.get(z.orientCode);
                merged.count += z.count;
                merged.bundleCount += (z.bundleCount || 0);
                merged.boxes.push(...z.boxes);
                merged.bundles.push(...(z.bundles || []));
            }

            let activeZones = Array.from(zoneMap.values());
            let maxH = 0;
            activeZones.forEach(z => {
                z.boxes.forEach(b => {
                    if (b.z + b.h > maxH) maxH = b.z + b.h;
                });
            });

            return { total: totalBoxesCount, zones: activeZones, usedHeight: maxH, isBundled: isBundled, bundleSize: bundleSize };
        }

        function permute(arr) {
            if (arr.length <= 1) return [arr];
            let result = [];
            for (let i = 0; i < arr.length; i++) {
                let current = arr[i];
                let remaining = arr.slice(0, i).concat(arr.slice(i + 1));
                let remainingPerms = permute(remaining);
                for (let p of remainingPerms) {
                    result.push([current].concat(p));
                }
            }
            return result;
        }

        function generateVariantsForMode(boxW, boxL, boxH, itemW, itemL, itemH, targetCount, activeMasterCats, isBundled, bundleSize) {
            const categorySubCodes = {
                'vyska': ['vyska', 'vyska_90'],
                'bok': ['bok', 'bok_90'],
                'lezato': ['lezato', 'lezato_90']
            };

            let allowedSubCodes = [];
            activeMasterCats.forEach(cat => {
                if (categorySubCodes[cat]) {
                    allowedSubCodes.push(...categorySubCodes[cat]);
                }
            });

            if (allowedSubCodes.length === 0) return [];

            const perms = permute(allowedSubCodes);
            let resultsMap = new Map();

            perms.forEach(subCodesPerm => {
                const res = evaluateSubCodesPermutation(boxW, boxL, boxH, itemW, itemL, itemH, subCodesPerm, targetCount, isBundled, bundleSize);
                if (res.total > 0) {
                    const sig = res.zones.map(z => `${z.orientCode}:${z.count}`).sort().join('|');
                    if (!resultsMap.has(sig)) {
                        const itemVol = itemW * itemL * itemH;
                        const totalVol = boxW * boxL * boxH;
                        const packedVol = res.total * itemVol;
                        const utilization = Math.min(100, (packedVol / totalVol) * 100);

                        resultsMap.set(sig, {
                            total: res.total,
                            utilization: utilization,
                            usedHeight: res.usedHeight,
                            zones: res.zones,
                            subCodesPerm: subCodesPerm
                        });
                    }
                }
            });

            let variants = Array.from(resultsMap.values());
            variants.sort((a, b) => {
                if (b.total !== a.total) return b.total - a.total;
                return b.utilization - a.utilization;
            });

            return variants.slice(0, 6);
        }

        const ZONE_COLORS = [0x6366f1, 0xec4899, 0xf59e0b, 0x10b981, 0x06b6d4, 0xa855f7];
        const ZONE_MATERIALS = ZONE_COLORS.map(c => new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: 0.9 }));

            'ambi_nordic': [

        };

        let currentPresetsList = [];

        function getActivePresetKey() {
            const env = document.getElementById('envSelect').value;
            const country = document.getElementById('countrySelect').value;

            if (env === 'ambi') {
                if (['DK', 'SE', 'FI'].includes(country)) return 'ambi_nordic';
                if (country === 'DE') return 'ambi_de';
                if (country === 'AT') return 'ambi_at';
            } else if (env === 'cool') {
                if (['DK', 'SE', 'FI'].includes(country)) return 'cool_nordic';
                if (['DE', 'AT'].includes(country)) return 'cool_de_at';
            }
            return 'ambi_nordic';
        }

        function updateEuroboxDropdown() {
            const select = document.getElementById('euroboxType');
            const key = getActivePresetKey();
            currentPresetsList = BOX_PRESETS[key] || [];

            let html = '';
            currentPresetsList.forEach((p, idx) => {
                const isDefault = (key === 'cool_de_at' && idx === 1) ? 'selected' : (idx === 0 ? 'selected' : '');
                html += `<option value="${idx}" ${isDefault}>${p.name}</option>`;
            });
            html += `<option value="custom">Vlastní rozměry...</option>`;
            select.innerHTML = html;

            handleEuroboxChange();
        }

        function updateScene(result, boxW, boxL, boxH, isBundled, bundleSize) {
            while (boxGroup.children.length > 0) {
                const obj = boxGroup.children[0];
                boxGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            if (euroboxMesh) scene.remove(euroboxMesh);
            if (euroboxWireframe) scene.remove(euroboxWireframe);

            const boxGeo = new THREE.BoxGeometry(boxW, boxH, boxL);
            boxGeo.translate(boxW / 2, boxH / 2, boxL / 2);

            const wireMat = new THREE.MeshBasicMaterial({
                color: 0x64748b,
                wireframe: true,
                transparent: true,
                opacity: isWireframeTransparent ? 0.35 : 0.8
            });
            euroboxWireframe = new THREE.Mesh(boxGeo, wireMat);
            scene.add(euroboxWireframe);

            if (!result || !result.zones) {
                controls.target.set(boxW / 2, boxH / 2, boxL / 2);
                controls.update();
                return;
            }

            const boxGeomTemplate = new THREE.BoxGeometry(1, 1, 1);
            const edgeGeomTemplate = new THREE.EdgesGeometry(boxGeomTemplate);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 1, transparent: true, opacity: 0.3 });
            const bundleEdgeMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3, transparent: true, opacity: 1.0 });

            for (let zIdx = 0; zIdx < result.zones.length; zIdx++) {
                const zone = result.zones[zIdx];
                const mat = ZONE_MATERIALS[zIdx % ZONE_MATERIALS.length];
                const boxes = zone.boxes;

                for (let i = 0; i < boxes.length; i++) {
                    const b = boxes[i];
                    const mesh = new THREE.Mesh(boxGeomTemplate, mat);
                    mesh.scale.set(b.w - 0.1, b.h - 0.1, b.l - 0.1);
                    mesh.position.set(b.x + b.w / 2, b.z + b.h / 2, b.y + b.l / 2);
                    
                    const edges = new THREE.LineSegments(edgeGeomTemplate, edgeMat);
                    mesh.add(edges);

                    boxGroup.add(mesh);
                }

                if (isBundled && zone.bundles && zone.bundles.length > 0) {
                    for (let bIdx = 0; bIdx < zone.bundles.length; bIdx++) {
                        const bun = zone.bundles[bIdx];
                        const bunGeo = new THREE.BoxGeometry(bun.w, bun.h, bun.l);
                        bunGeo.translate(bun.w / 2, bun.h / 2, bun.l / 2);
                        const bunEdgesGeo = new THREE.EdgesGeometry(bunGeo);
                        const bunOutline = new THREE.LineSegments(bunEdgesGeo, bundleEdgeMat);
                        bunOutline.position.set(bun.x, bun.z, bun.y);
                        boxGroup.add(bunOutline);
                    }
                }
            }

            controls.target.set(boxW / 2, boxH / 2, boxL / 2);
            controls.update();
        }

        function updateLegend(numZones, hasBundles, bundleSize) {
            const legend = document.getElementById('legendContainer');
            let html = '';
            const names = ['Zóna 1', 'Zóna 2', 'Zóna 3', 'Zóna 4', 'Zóna 5', 'Zóna 6'];
            const hexColors = ['bg-indigo-500', 'bg-pink-500', 'bg-amber-500', 'bg-emerald-500', 'bg-cyan-500', 'bg-purple-500'];

            for (let i = 0; i < numZones; i++) {
                html += `<div class="flex items-center space-x-1.5"><span class="w-3 h-3 rounded-md ${hexColors[i % hexColors.length]} inline-block"></span><span class="text-slate-300 font-medium">${names[i]}</span></div>`;
            }
            if (hasBundles) {
                html += `<div class="flex items-center space-x-1.5 border-l border-slate-700 pl-3"><span class="w-3 h-3 rounded-md border-2 border-black bg-slate-300 inline-block"></span><span class="text-slate-200 font-medium">Balíček (${bundleSize} ks)</span></div>`;
            }
            html += `<div class="flex items-center space-x-1.5 border-l border-slate-700 pl-3"><span class="w-3 h-3 rounded-md border border-slate-400 inline-block"></span><span class="text-slate-400">Přepravka</span></div>`;
            legend.innerHTML = html;
        }

        function updateVariantHUD() {
            const activeList = (selectedVariantTab === 'nobundle') ? computedNoBundleVariants : computedBundleVariants;
            const titleEl = document.getElementById('hudVariantTitle');
            const statsEl = document.getElementById('hudVariantStats');

            if (!activeList || activeList.length === 0) {
                titleEl.innerText = 'Žádná varianta';
                statsEl.innerText = '0 ks • 0.0%';
                return;
            }

            if (selectedVariantIndex >= activeList.length) selectedVariantIndex = 0;
            const v = activeList[selectedVariantIndex];

            titleEl.innerText = `Varianta ${selectedVariantIndex + 1} / ${activeList.length}`;
            statsEl.innerText = `${v.total} ks • ${v.utilization.toFixed(1)}%`;
        }

        window.nextVariant = function() {
            const activeList = (selectedVariantTab === 'nobundle') ? computedNoBundleVariants : computedBundleVariants;
            if (!activeList || activeList.length === 0) return;
            selectedVariantIndex = (selectedVariantIndex + 1) % activeList.length;
            updateVariantHUD();
            displayActiveVariant();
        };

        window.prevVariant = function() {
            const activeList = (selectedVariantTab === 'nobundle') ? computedNoBundleVariants : computedBundleVariants;
            if (!activeList || activeList.length === 0) return;
            selectedVariantIndex = (selectedVariantIndex - 1 + activeList.length) % activeList.length;
            updateVariantHUD();
            displayActiveVariant();
        };

        function handleEuroboxChange() {
            const val = document.getElementById('euroboxType').value;
            const customDiv = document.getElementById('customEuroboxContainer');
            const infoDiv = document.getElementById('euroboxInfo');

            if (val === 'custom') {
                customDiv.classList.remove('hidden');
                infoDiv.classList.add('hidden');
            } else {
                customDiv.classList.add('hidden');
                infoDiv.classList.remove('hidden');
                const p = currentPresetsList[parseInt(val)];
                if (p) {
                    document.getElementById('boxW').value = p.w;
                    document.getElementById('boxL').value = p.l;
                    document.getElementById('boxH').value = p.h;
                    infoDiv.innerText = `Vnitřní rozměry: Šířka ${p.w} cm, Délka ${p.l} cm, Výška ${p.h} cm`;
                }
            }
            runOptimizationAndRender();
        }

        function displayActiveVariant() {
            const boxW = parseFloat(document.getElementById('boxW').value) || 30;
            const boxL = parseFloat(document.getElementById('boxL').value) || 40;
            const boxH = parseFloat(document.getElementById('boxH').value) || 15;
            const targetCount = parseInt(document.getElementById('targetCount').value) || 0;
            const isBundled = document.getElementById('bundleCheck').checked;
            const bundleSize = parseInt(document.getElementById('bundleSizeInput').value) || 5;

            const itemW = parseFloat(document.getElementById('itemW').value) || 1;
            const itemL = parseFloat(document.getElementById('itemL').value) || 1;
            const itemH = parseFloat(document.getElementById('itemH').value) || 1;

            const activeMasterCats = [];
            if (document.getElementById('orient_vyska').checked) activeMasterCats.push('vyska');
            if (document.getElementById('orient_bok').checked) activeMasterCats.push('bok');
            if (document.getElementById('orient_lezato').checked) activeMasterCats.push('lezato');

            const activeList = (selectedVariantTab === 'nobundle') ? computedNoBundleVariants : computedBundleVariants;
            if (!activeList || activeList.length === 0 || selectedVariantIndex >= activeList.length) {
                document.getElementById('totalBoxes').innerText = '0';
                document.getElementById('utilizationPct').innerText = '0.0%';
                document.getElementById('zoneBreakdown').innerHTML = '<div>• Žádné krabičky se nevejdou</div>';
                document.getElementById('multiBoxInfo').classList.add('hidden');
                updateScene(null, boxW, boxL, boxH, isBundled, bundleSize);
                updateLegend(0, isBundled, bundleSize);
                return;
            }

            const variant = activeList[selectedVariantIndex];
            
            document.getElementById('totalBoxes').innerText = variant.total;
            document.getElementById('utilizationPct').innerText = variant.utilization.toFixed(1) + '%';

            let breakdownHTML = '';
            variant.zones.forEach((z, i) => {
                const lbl = z && z.dims && z.dims.label ? z.dims.label : '-';
                if (isBundled && z.bundleCount !== undefined && z.bundleCount > 0) {
                    const looseCount = z.count - (z.bundleCount * bundleSize);
                    if (looseCount > 0) {
                        breakdownHTML += `<div>• Zóna ${i+1}: <strong class="text-white">${z.count} ks</strong> (${z.bundleCount} balíčků po ${bundleSize} ks + ${looseCount} volných, ${lbl})</div>`;
                    } else {
                        breakdownHTML += `<div>• Zóna ${i+1}: <strong class="text-white">${z.count} ks</strong> (${z.bundleCount} balíčků po ${bundleSize} ks, ${lbl})</div>`;
                    }
                } else {
                    breakdownHTML += `<div>• Zóna ${i+1}: <strong class="text-white">${z.count} ks</strong> (${lbl})</div>`;
                }
            });

            document.getElementById('zoneBreakdown').innerHTML = breakdownHTML;

            const multiBoxInfo = document.getElementById('multiBoxInfo');
            const totalBoxesLabel = document.getElementById('totalBoxesLabel');
            if (targetCount > 0) {
                totalBoxesLabel.innerText = `Celkem ks / bedna (cíl: ${targetCount})`;
                const perBoxMax = variant.total;
                if (perBoxMax > 0) {
                    const neededBoxes = Math.ceil(targetCount / perBoxMax);
                    const lastBoxCount = targetCount % perBoxMax === 0 ? perBoxMax : targetCount % perBoxMax;
                    const selectedPresetName = document.getElementById('euroboxType').value === 'custom' ? 'Vlastní bedna' : (currentPresetsList[parseInt(document.getElementById('euroboxType').value)]?.name || 'Zvolená bedna');
                    
                    let lastBoxName = selectedPresetName;
                    if (lastBoxCount < perBoxMax) {
                        let validPresets = [...currentPresetsList].map((p) => ({ ...p, volume: p.w * p.l * p.h }));
                        if (document.getElementById('euroboxType').value === 'custom') {
                            validPresets.push({ name: 'Vlastní bedna', w: boxW, l: boxL, h: boxH, volume: boxW * boxL * boxH });
                        }
                        validPresets.sort((a, b) => a.volume - b.volume);

                        for (let p of validPresets) {
                            const testVariants = generateVariantsForMode(p.w, p.l, p.h, itemW, itemL, itemH, lastBoxCount, activeMasterCats, isBundled, bundleSize);
                            if (testVariants.length > 0 && testVariants[0].total >= lastBoxCount) {
                                lastBoxName = p.name;
                                break;
                            }
                        }
                    }

                    multiBoxInfo.classList.remove('hidden');
                    multiBoxInfo.innerHTML = `
                        <div class="font-semibold">⚠️ Do 1 bedny se vejde max ${perBoxMax} ks</div>
                        <div>Pro ${targetCount} ks potřebujete celkem <strong class="text-white">${neededBoxes} ks</strong> přepravek:</div>
                        <div class="pl-2">• ${neededBoxes - (lastBoxCount < perBoxMax ? 1 : 0)}× plná bedna (${perBoxMax} ks)</div>
                        ${lastBoxCount < perBoxMax ? `<div class="pl-2">• Poslední bedna (${lastBoxName}): <strong class="text-white">${lastBoxCount} ks</strong></div>` : ''}
                    `;
                } else {
                    multiBoxInfo.classList.add('hidden');
                }
            } else {
                totalBoxesLabel.innerText = 'Celkem ks / bedna';
                multiBoxInfo.classList.add('hidden');
            }

            updateLegend(variant.zones.length, isBundled, bundleSize);
            updateScene(variant, boxW, boxL, boxH, isBundled, bundleSize);
        }

        function runOptimizationAndRender() {
            const boxW = parseFloat(document.getElementById('boxW').value) || 30;
            const boxL = parseFloat(document.getElementById('boxL').value) || 40;
            const boxH = parseFloat(document.getElementById('boxH').value) || 15;

            const itemW = parseFloat(document.getElementById('itemW').value);
            const itemL = parseFloat(document.getElementById('itemL').value);
            const itemH = parseFloat(document.getElementById('itemH').value);

            const targetCount = parseInt(document.getElementById('targetCount').value) || 0;
            const isBundled = document.getElementById('bundleCheck').checked;
            const bundleSize = parseInt(document.getElementById('bundleSizeInput').value) || 5;

            const bundleSizeContainer = document.getElementById('bundleSizeContainer');
            if (isBundled) {
                bundleSizeContainer.classList.remove('hidden');
            } else {
                bundleSizeContainer.classList.add('hidden');
            }

            const activeMasterCats = [];
            if (document.getElementById('orient_vyska').checked) activeMasterCats.push('vyska');
            if (document.getElementById('orient_bok').checked) activeMasterCats.push('bok');
            if (document.getElementById('orient_lezato').checked) activeMasterCats.push('lezato');

            computedNoBundleVariants = generateVariantsForMode(boxW, boxL, boxH, itemW, itemL, itemH, targetCount, activeMasterCats, false, bundleSize);
            computedBundleVariants = generateVariantsForMode(boxW, boxL, boxH, itemW, itemL, itemH, targetCount, activeMasterCats, true, bundleSize);

            selectedVariantTab = isBundled ? 'bundle' : 'nobundle';
            const activeList = (selectedVariantTab === 'nobundle') ? computedNoBundleVariants : computedBundleVariants;
            if (selectedVariantIndex >= activeList.length) {
                selectedVariantIndex = 0;
            }

            updateVariantHUD();
            displayActiveVariant();
        }

        document.getElementById('euroboxType').addEventListener('change', handleEuroboxChange);
        document.getElementById('envSelect').addEventListener('change', updateEuroboxDropdown);
        document.getElementById('countrySelect').addEventListener('change', updateEuroboxDropdown);

        document.getElementById('boxW').addEventListener('input', runOptimizationAndRender);
        document.getElementById('boxL').addEventListener('input', runOptimizationAndRender);
        document.getElementById('boxH').addEventListener('input', runOptimizationAndRender);
        document.getElementById('itemW').addEventListener('input', runOptimizationAndRender);
        document.getElementById('itemL').addEventListener('input', runOptimizationAndRender);
        document.getElementById('itemH').addEventListener('input', runOptimizationAndRender);
        document.getElementById('targetCount').addEventListener('input', runOptimizationAndRender);
        document.getElementById('bundleCheck').addEventListener('change', () => {
            const isBundled = document.getElementById('bundleCheck').checked;
            selectedVariantTab = isBundled ? 'bundle' : 'nobundle';
            selectedVariantIndex = 0;
            runOptimizationAndRender();
        });
        document.getElementById('bundleSizeInput').addEventListener('input', runOptimizationAndRender);

        const switchIds = ['orient_vyska', 'orient_bok', 'orient_lezato'];
        switchIds.forEach(id => {
            document.getElementById(id).addEventListener('change', runOptimizationAndRender);
        });

        document.getElementById('resetCamBtn').addEventListener('click', () => {
            const boxW = parseFloat(document.getElementById('boxW').value) || 30;
            const boxL = parseFloat(document.getElementById('boxL').value) || 40;
            const boxH = parseFloat(document.getElementById('boxH').value) || 15;
            camera.position.set(boxW * 2, boxH * 2.5, boxL * 2);
            controls.target.set(boxW / 2, boxH / 2, boxL / 2);
            controls.update();
        });

        const sidebar = document.getElementById('sidebar');
        const splitter = document.getElementById('splitter');
        let isResizing = false;

        if (splitter) {
            splitter.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                window.getSelection().removeAllRanges();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const newWidth = e.clientX;
                if (newWidth >= 320 && newWidth <= window.innerWidth - 300) {
                    sidebar.style.width = newWidth + 'px';
                    sidebar.style.flex = 'none';
                    onWindowResize();
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    onWindowResize();
                }
            });
        }

        window.onload = function() {
            initThree();
            animate();
            updateEuroboxDropdown();
        };
    </script>
</body>
</html>
